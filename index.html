<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Follow-Up Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#1b2733;--muted:#5d6b7a;--line:#d9e0e8;--accent:#1f4e78;--accentText:#fff;--danger:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18212b;--text:#e8eef4;--muted:#9aa8b6;--line:#2c3947;--accent:#5aa2dc;--accentText:#08121c;--danger:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--card:#18212b;--text:#e8eef4;--muted:#9aa8b6;--line:#2c3947;--accent:#5aa2dc;--accentText:#08121c;--danger:#f97066;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:15px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:6px;padding:9px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accentText)}
button.ghost{background:transparent;color:var(--accent)}
button.del{background:transparent;color:var(--danger);border-color:var(--line);padding:5px 9px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar h2{font-size:16px;margin:0}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td input{padding:6px}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
</style>
</head>
<body>
<main>
  <h1>Client Follow-Up Tracker</h1>
  <p class="sub">Enter a client below. Entries are saved in this browser, and you can export a copy to Excel anytime.</p>

  <div class="card">
    <form id="f">
      <label>Client Name<input name="name" required autocomplete="off"></label>
      <label>Company<input name="company" required autocomplete="off"></label>
      <label>Proposal<input name="proposal" autocomplete="off" placeholder="Title or status"></label>
      <label>First Follow Up<input type="date" name="f1"></label>
      <label>2nd Follow Up<input type="date" name="f2"></label>
      <label>3rd Follow Up<input type="date" name="f3"></label>
      <div class="actions"><button type="submit">Add Client</button><button type="reset" class="ghost">Clear</button></div>
    </form>
  </div>

  <div class="card">
    <div class="bar">
      <h2>Clients (<span id="count">0</span>)</h2>
      <button id="xl" type="button">Export to Excel</button>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th>Client Name</th><th>Company</th><th>Proposal</th><th>First Follow Up</th><th>2nd Follow Up</th><th>3rd Follow Up</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty">No clients yet. Add your first one above.</div>
    </div>
    <p class="note" id="note"></p>
  </div>
</main>

<script>
(function(){
  var KEYS=["name","company","proposal","f1","f2","f3"];
  var rows=[], LKEY="client-tracker-rows";
  var $=function(id){return document.getElementById(id)};

  function lsLoad(){try{return JSON.parse(localStorage.getItem(LKEY)||"[]")}catch(e){return []}}
  function lsSave(){try{localStorage.setItem(LKEY,JSON.stringify(rows))}catch(e){}}

  function render(){
    var tb=$("rows"); tb.textContent="";
    rows.forEach(function(r){
      var tr=document.createElement("tr");
      KEYS.forEach(function(k){
        var td=document.createElement("td");
        if(k==="f1"||k==="f2"||k==="f3"){
          var i=document.createElement("input"); i.type="date"; i.value=r[k]||"";
          i.addEventListener("change",function(){update(r,k,i.value)});
          td.appendChild(i);
        } else td.textContent=r[k]||"";
        tr.appendChild(td);
      });
      var td=document.createElement("td");
      var b=document.createElement("button"); b.className="del"; b.type="button"; b.textContent="Delete";
      b.addEventListener("click",function(){ if(confirm("Delete this client?")) remove(r); });
      td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
    });
    $("count").textContent=rows.length;
    $("empty").style.display=rows.length?"none":"block";
  }

  function add(data){
    data.createdAt=Date.now(); data.id="l"+data.createdAt;
    rows.push(data); lsSave(); render();
  }
  function update(r,k,v){ r[k]=v; lsSave(); }
  function remove(r){ rows=rows.filter(function(x){return x!==r}); lsSave(); render(); }

  $("f").addEventListener("submit",function(e){
    e.preventDefault();
    var fd=new FormData(e.target), d={};
    KEYS.forEach(function(k){d[k]=(fd.get(k)||"").trim()});
    add(d); e.target.reset(); e.target.elements.name.focus();
  });

  $("xl").addEventListener("click",function(){
    if(!rows.length){alert("Add at least one client first.");return}
    if(typeof XLSX==="undefined"){alert("Excel export could not load. Check your connection and reload.");return}
    var aoa=[["Client Name","Company","Proposal","First Follow Up","2nd Follow Up","3rd Follow Up"]];
    rows.forEach(function(r){
      aoa.push([r.name,r.company,r.proposal].concat(["f1","f2","f3"].map(function(k){return r[k]?new Date(r[k]+"T00:00:00Z"):""})));
    });
    var ws=XLSX.utils.aoa_to_sheet(aoa,{cellDates:true});
    ws["!cols"]=[{wch:24},{wch:28},{wch:34},{wch:18},{wch:18},{wch:18}];
    for(var R=1;R<aoa.length;R++)for(var C=3;C<6;C++){var c=ws[XLSX.utils.encode_cell({r:R,c:C})];if(c&&c.t==="d")c.z="mmm d, yyyy";}
    var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Client Tracker");
    var out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    var blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var link=document.createElement("a");
    link.href=URL.createObjectURL(blob); link.download="Client_Follow_Up_Tracker.xlsx";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function(){URL.revokeObjectURL(link.href)},1000);
  });

  rows=lsLoad(); render();
  $("note").textContent="Saved in this browser. Export to Excel regularly to keep a backup.";
})();
</script>
</body>
</html>
